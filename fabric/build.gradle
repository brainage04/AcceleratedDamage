plugins {
	id 'info.solidsoft.pitest' version '1.19.0'
}

dependencies {
	// jqwik 1.10.2 is built on JUnit Platform 1.14, so the JUnit modules follow the same release line.
	testImplementation platform('org.junit:junit-bom:5.14.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'net.jqwik:jqwik:1.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

pitest {
	pitestVersion = '1.30.2'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['io.github.brainage04.accelerateddamage.util.CompressedTicks']
	targetTests = ['io.github.brainage04.accelerateddamage.util.*']
	additionalMutableCodePaths = project(':common').sourceSets.main.output.classesDirs.files
	threads = 1
	timeoutConstInMillis = 5000
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}
tasks.named('test') {
	// fabric-loader-junit runs the tests inside the Fabric loader, where jqwik finds no @Property methods
	// (MagicCarpet's CarpetMotionTest ran 6 of its 10 tests there, 14 Nov 2026). The unit tests need no loader.
	classpath = classpath.filter { !it.name.startsWith('fabric-loader-junit') }
}
tasks.named('pitest') {
	dependsOn ':common:classes'
	// With fabric-loader-junit on the classpath PIT records no coverage (SimpleTwitchChat measured 0 of 90 lines),
	// and the util tests do not need the Fabric loader.
	def classpath = files(additionalClasspath.from.toList())
	additionalClasspath.setFrom(classpath.filter { !it.name.startsWith('fabric-loader-junit') })
}
