plugins {
    id 'dev.architectury.loom-no-remap'
    id 'dev.architectury.loom'
}

sourceSets {
    main {
        java.srcDir rootProject.file('src/main/java')
        resources.srcDir rootProject.file('src/main/resources')
    }
    test {
        java.srcDir rootProject.file('src/test/java')
        resources.srcDir rootProject.file('src/test/resources')
    }
}

loom {
    accessWidenerPath = rootProject.file('src/main/resources/accelerateddamage.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
